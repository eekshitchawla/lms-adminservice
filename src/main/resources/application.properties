spring.application.name=adminservice
server.port=${PORT:8082}

# Database Configuration
# Local default: H2 in-memory DB for personal project use
# Override by setting SPRING_DATASOURCE_URL to a PostgreSQL URL in Docker/cloud deployments
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:${DB_NAME:lms};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# Allow app to start without database
spring.datasource.hikari.initialization-fail-timeout=0

# JWT Configuration
jwt.secret=${JWT_SECRET:MyVerySecureSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Redis Configuration (Optional for OTP caching)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=60000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
# Disable Redis if connection fails
spring.redis.client-name=admin-service-client

# Email Configuration (optional, for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.root=INFO
logging.level.com.eeki.adminservice=DEBUG

# Actuator / Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.mail.enabled=false
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
management.endpoint.health.show-details=always
